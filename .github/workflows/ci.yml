name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      # Informational only (continue-on-error): this repo has ~119
      # pre-existing findings, many from rule categories (BLE001 blind-
      # except, S110/S112 try-except-pass/continue) that conflict with a
      # deliberate project pattern - see e.g. clients/proxy_provider.py's
      # own module docstring on "degrade to None, don't crash the caller".
      # Gating merges on 100% clean ruff right away would just block on
      # pre-existing, often-intentional code rather than new regressions.
      # Flip this to a hard failure once the backlog above is triaged
      # (either fixed or explicitly ignored per-rule in pyproject.toml).
      - name: Lint (ruff, informational)
        continue-on-error: true
        run: ruff check social_crawler tests

      # Blocking: this suite only tests pure extraction logic against
      # captured fixtures (no live network/DB/Redis needed), so it's safe
      # to run in CI and should stay green - a break here is a real
      # regression, not pre-existing debt.
      - name: Test (pytest)
        run: pytest tests/ -v

  # Deploy lên VPS khi push main và test xanh - cùng cơ chế với cinemark-api (script deploy-repo nằm ở
  # cinemark-api/deploy/vps/deploy-repo.sh). Bật bằng biến repo DEPLOY_ENABLED=true sau khi thêm các secret VPS_*.
  deploy:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-spider-hub
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" sudo /usr/local/sbin/deploy-repo spider-hub
