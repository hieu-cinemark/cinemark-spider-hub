name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      # Informational only (continue-on-error): this repo has ~119
      # pre-existing findings, many from rule categories (BLE001 blind-
      # except, S110/S112 try-except-pass/continue) that conflict with a
      # deliberate project pattern - see e.g. services/proxy_provider.py's
      # own module docstring on "degrade to None, don't crash the caller".
      # Gating merges on 100% clean ruff right away would just block on
      # pre-existing, often-intentional code rather than new regressions.
      # Flip this to a hard failure once the backlog above is triaged
      # (either fixed or explicitly ignored per-rule in pyproject.toml).
      - name: Lint (ruff, informational)
        continue-on-error: true
        run: ruff check social_crawler tests

      # Blocking: this suite only tests pure extraction logic against
      # captured fixtures (no live network/DB/Redis needed), so it's safe
      # to run in CI and should stay green - a break here is a real
      # regression, not pre-existing debt.
      - name: Test (pytest)
        run: pytest tests/ -v
