# Fallback without a domain: https://<VPS-IP>:8443 with a self-signed certificate (install.sh). With a domain use
# nginx-spider-hub-domain.conf instead (install-domain.sh disables this one).
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/spider-hub.crt;
    ssl_certificate_key /etc/nginx/ssl/spider-hub.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/spider-hub-locations.conf;
}
