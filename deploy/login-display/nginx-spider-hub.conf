# spider-hub dashboard + API + manual-login viewer on ONE origin: https://<VPS-IP>:8443 (self-signed TLS + Basic Auth).
# Everything behind it listens on 127.0.0.1 only. Copy to /etc/nginx/sites-available/spider-hub (install.sh does it).
# Basic Auth guards every path: the dashboard can open a logged-in Facebook browser (manual login) - never remove it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/spider-hub.crt;
    ssl_certificate_key /etc/nginx/ssl/spider-hub.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "spider-hub";
    auth_basic_user_file /etc/nginx/spider-hub.htpasswd;

    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # Who passed Basic Auth - the dashboard's manual-login route only starts a browser when this is set. Always
    # overwritten here, so a client cannot send its own.
    proxy_set_header X-Spider-Auth-User $remote_user;
    proxy_read_timeout 3600s;

    # cinemark-api (dashboard built with NEXT_PUBLIC_API_BASE_URL=https://<VPS-IP>:8443/api): strip the /api prefix.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
    }

    # noVNC viewer + its websocket (vnc.html?path=novnc/websockify).
    location /novnc/ {
        proxy_pass http://127.0.0.1:6080/;
    }

    # spider-hub-dashboard (next start).
    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
