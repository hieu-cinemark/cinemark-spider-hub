# https://__DOMAIN__ - the spider-hub dashboard + API + manual-login viewer (ticket-protected), Let's Encrypt certificate
# (certbot, already issued for __DOMAIN__). Written by install-domain.sh (replaces __DOMAIN__).
server {
    listen 443 ssl;
    server_name __DOMAIN__ www.__DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/spider-hub-locations.conf;
}

# Plain HTTP: certbot renewals (nginx plugin answers the challenge here) + redirect everything else to HTTPS.
server {
    listen 80 default_server;
    server_name __DOMAIN__ www.__DOMAIN__;
    location / {
        return 301 https://$host$request_uri;
    }
}
