# /etc/nginx/snippets/spider-hub-locations.conf - shared by the domain site (nginx-spider-hub-domain.conf) and the
# IP:8443 fallback (nginx-spider-hub.conf). No Basic Auth since 27/10/2026: the dashboard has its own API-key login and
# cinemark-api enforces the key.
client_max_body_size 20m;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_read_timeout 3600s;

# cinemark-api (dashboard built with NEXT_PUBLIC_API_BASE_URL=https://<host>/api): strip the /api prefix.
location /api/ {
    proxy_pass http://127.0.0.1:8000/;
}

# spider-hub-dashboard (next start).
location / {
    proxy_pass http://127.0.0.1:3001;
}
