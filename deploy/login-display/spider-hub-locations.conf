# /etc/nginx/snippets/spider-hub-locations.conf - shared by the domain site (nginx-spider-hub-domain.conf) and the
# IP:8443 fallback (nginx-spider-hub.conf). No Basic Auth since 27/10/2026: the dashboard has its own API-key login and
# cinemark-api enforces the key. The manual-login viewer (/novnc) is the exception - whoever reaches it can drive a
# logged-in Facebook browser - so every /novnc request needs a ticket cookie that the dashboard only issues to a browser
# holding the right API key (checked through auth_request below). Never make /novnc reachable without it.
client_max_body_size 20m;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_read_timeout 3600s;

# cinemark-api (dashboard built with NEXT_PUBLIC_API_BASE_URL=https://<host>/api): strip the /api prefix.
location /api/ {
    proxy_pass http://127.0.0.1:8000/;
}

# Ticket check for /novnc (spider-hub-dashboard src/app/dash-api/novnc-auth) - internal only, not reachable from outside.
location = /dash-api/novnc-auth {
    internal;
    proxy_pass http://127.0.0.1:3001;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

# noVNC viewer + its websocket (vnc.html?path=novnc/websockify), only with a valid ticket.
location /novnc/ {
    auth_request /dash-api/novnc-auth;
    error_page 401 = @novnc_denied;
    proxy_pass http://127.0.0.1:6080/;
}
location @novnc_denied {
    default_type "text/plain; charset=utf-8";
    return 401 "Mở màn hình đăng nhập từ nút \"Đăng nhập tay\" trên dashboard.\n";
}

# spider-hub-dashboard (next start).
location / {
    proxy_pass http://127.0.0.1:3001;
}
